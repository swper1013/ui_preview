<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 블랙아이스 관제 UI Preview</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="assets/js/preview.js" defer></script>
</head>
<body class="login-body" data-page="login">
<main class="login-shell">
    <section class="login-panel">
        <div class="login-panel__header">
            <span class="login-panel__eyebrow">Black Ice Device Control</span>
            <h1>관리자 로그인 프리뷰</h1>
        </div>

        <form class="login-form" data-login-form>
            <label class="form-field">
                <span>아이디</span>
                <input type="text" value="admin" placeholder="admin">
            </label>

            <label class="form-field">
                <span>비밀번호</span>
                <input type="password" value="admin123" placeholder="admin123">
            </label>

            <button type="submit" class="button button--primary button--full">시스템 진입</button>
        </form>
    </section>
</main>
</body>
</html>
